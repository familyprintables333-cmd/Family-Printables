<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="80%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0a0f1d" />
    </linearGradient>

    <!-- Luxury Gold Foil Gradient -->
    <linearGradient id="goldFoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6E05E" />
      <stop offset="25%" stop-color="#ECC94B" />
      <stop offset="50%" stop-color="#D69E2E" />
      <stop offset="75%" stop-color="#FAF089" />
      <stop offset="100%" stop-color="#B7791F" />
    </linearGradient>

    <!-- Rose Gold / Bronze Accent -->
    <linearGradient id="bronzeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ED8936" />
      <stop offset="50%" stop-color="#FBD38D" />
      <stop offset="100%" stop-color="#DD6B20" />
    </linearGradient>

    <!-- Paper Surface Gradient -->
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="luxuryShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="35" flood-color="#000000" flood-opacity="0.65" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="900" fill="url(#bgGrad)" />

  <!-- Subtle Geometric Desk Pattern -->
  <g opacity="0.04" stroke="#FFFFFF" stroke-width="1.5">
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="0" y1="600" x2="1200" y2="600" />
    <line x1="0" y1="750" x2="1200" y2="750" />
    <line x1="200" y1="0" x2="200" y2="900" />
    <line x1="400" y1="0" x2="400" y2="900" />
    <line x1="600" y1="0" x2="600" y2="900" />
    <line x1="800" y1="0" x2="800" y2="900" />
    <line x1="1000" y1="0" x2="1000" y2="900" />
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="180" r="280" fill="#6366F1" opacity="0.08" filter="url(#glow)" />
  <circle cx="1050" cy="720" r="250" fill="#D97706" opacity="0.07" filter="url(#glow)" />

  <!-- Decorative Floating Tablet / Digital Guide Backdrop -->
  <g transform="rotate(-6 380 440)" opacity="0.5">
    <rect x="220" y="160" width="460" height="620" rx="28" fill="#020617" stroke="#334155" stroke-width="4" filter="url(#luxuryShadow)" />
    <!-- Screen -->
    <rect x="240" y="180" width="420" height="580" rx="16" fill="#0f172a" />
    <!-- Digital UI Lines -->
    <rect x="270" y="220" width="180" height="12" rx="6" fill="#38bdf8" opacity="0.8" />
    <rect x="270" y="250" width="360" height="8" rx="4" fill="#64748b" opacity="0.5" />
    <rect x="270" y="270" width="320" height="8" rx="4" fill="#64748b" opacity="0.3" />
    <!-- Schedule Grid Blocks -->
    <rect x="270" y="310" width="170" height="70" rx="8" fill="#1e293b" stroke="#334155" />
    <rect x="460" y="310" width="170" height="70" rx="8" fill="#1e293b" stroke="#334155" />
    <rect x="270" y="400" width="360" height="100" rx="8" fill="#1e293b" stroke="#334155" />
    <rect x="270" y="520" width="360" height="120" rx="8" fill="#1e293b" stroke="#334155" />
  </g>

  <!-- MAIN LUXURY EXECUTIVE HARDCOVER PLANNER (Center Stage) -->
  <g filter="url(#luxuryShadow)">
    <!-- Leather Cover Base Trim -->
    <rect x="420" y="90" width="620" height="720" rx="24" fill="#0a0f1d" stroke="url(#goldFoil)" stroke-width="3" />
    
    <!-- White Paper Inner Block -->
    <rect x="440" y="110" width="580" height="680" rx="14" fill="url(#paperGrad)" />

    <!-- Gold Foil Header Box -->
    <rect x="470" y="145" width="520" height="75" rx="12" fill="#0f172a" stroke="url(#goldFoil)" stroke-width="2" />
    
    <!-- Header Titles -->
    <text x="730" y="182" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="900" fill="url(#goldFoil)" text-anchor="middle" letter-spacing="4">
      ELITE PLANNER &amp; DIGITAL GUIDE
    </text>
    <text x="730" y="206" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#94A3B8" text-anchor="middle" letter-spacing="2">
      EXECUTIVE 90-DAY STRATEGIC TIME-BLOCKING &amp; GOALS
    </text>

    <!-- Top 3 Priority Strategic Modules -->
    <rect x="470" y="240" width="520" height="90" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />
    <rect x="470" y="240" width="520" height="26" rx="10" fill="#1E293B" />
    <text x="485" y="258" font-family="Arial, sans-serif" font-size="11" font-weight="800" fill="#F1F5F9" letter-spacing="1">
      TOP 3 STRATEGIC EXECUTIVE PRIORITIES
    </text>

    <!-- Priority Item 1 -->
    <circle cx="490" cy="285" r="9" fill="url(#goldFoil)" />
    <text x="490" y="289" font-family="Arial, sans-serif" font-size="10" font-weight="900" fill="#0F172A" text-anchor="middle">1</text>
    <text x="510" y="289" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#1E293B">Quarterly Business &amp; Family Milestone Roadmap</text>
    <rect x="910" y="278" width="65" height="15" rx="7.5" fill="#DCFCE7" />
    <text x="942" y="289" font-family="Arial, sans-serif" font-size="9" font-weight="800" fill="#15803D" text-anchor="middle">ACTIVE</text>

    <!-- Priority Item 2 -->
    <circle cx="490" cy="312" r="9" fill="url(#goldFoil)" />
    <text x="490" y="316" font-family="Arial, sans-serif" font-size="10" font-weight="900" fill="#0F172A" text-anchor="middle">2</text>
    <text x="510" y="316" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#1E293B">Focus Deep Work 4-Hour Time-Blocked Session</text>
    <rect x="910" y="305" width="65" height="15" rx="7.5" fill="#FEF3C7" />
    <text x="942" y="316" font-family="Arial, sans-serif" font-size="9" font-weight="800" fill="#B45309" text-anchor="middle">PRIORITY</text>

    <!-- Schedule Grid & Habit Ledger Columns -->
    <g transform="translate(470 345)">
      <!-- Left Column: Master Time-Block Schedule -->
      <rect x="0" y="0" width="310" height="375" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
      <rect x="0" y="0" width="310" height="28" rx="10" fill="#0F172A" />
      <text x="15" y="19" font-family="Arial, sans-serif" font-size="11" font-weight="800" fill="#F8FAFC">
        MASTER TIME-BLOCKED SCHEDULE
      </text>

      <!-- Time Rows -->
      <g font-family="'Courier New', monospace" font-size="11" font-weight="700" fill="#475569">
        <text x="12" y="52">06:00 AM</text>
        <line x1="85" y1="48" x2="295" y2="48" stroke="#E2E8F0" stroke-width="1" />
        <text x="95" y="52" font-family="Arial, sans-serif" font-weight="600" fill="#0F172A">Morning Clarity &amp; Mindset</text>

        <text x="12" y="85">08:00 AM</text>
        <line x1="85" y1="81" x2="295" y2="81" stroke="#E2E8F0" stroke-width="1" />
        <text x="95" y="85" font-family="Arial, sans-serif" font-weight="600" fill="#0F172A">Deep Focus Studio Block #1</text>

        <text x="12" y="118">10:30 AM</text>
        <line x1="85" y1="114" x2="295" y2="114" stroke="#E2E8F0" stroke-width="1" />
        <text x="95" y="118" font-family="Arial, sans-serif" font-weight="600" fill="#0F172A">Executive Team &amp; Projects</text>

        <text x="12" y="151">01:00 PM</text>
        <line x1="85" y1="147" x2="295" y2="147" stroke="#E2E8F0" stroke-width="1" />
        <text x="95" y="151" font-family="Arial, sans-serif" font-weight="600" fill="#0F172A">Healthy Nourishment &amp; Walk</text>

        <text x="12" y="184">02:30 PM</text>
        <line x1="85" y1="180" x2="295" y2="180" stroke="#E2E8F0" stroke-width="1" />
        <text x="95" y="184" font-family="Arial, sans-serif" font-weight="600" fill="#0F172A">Creative Production &amp; Review</text>

        <text x="12" y="217">04:30 PM</text>
        <line x1="85" y1="213" x2="295" y2="213" stroke="#E2E8F0" stroke-width="1" />
        <text x="95" y="217" font-family="Arial, sans-serif" font-weight="600" fill="#0F172A">Daily Wrap-Up &amp; Archival</text>

        <text x="12" y="250">06:30 PM</text>
        <line x1="85" y1="246" x2="295" y2="246" stroke="#E2E8F0" stroke-width="1" />
        <text x="95" y="250" font-family="Arial, sans-serif" font-weight="600" fill="#0F172A">Family Dinner &amp; Unwind</text>

        <text x="12" y="283">08:30 PM</text>
        <line x1="85" y1="279" x2="295" y2="279" stroke="#E2E8F0" stroke-width="1" />
        <text x="95" y="283" font-family="Arial, sans-serif" font-weight="600" fill="#0F172A">Reading &amp; Strategic Notes</text>

        <text x="12" y="316">10:00 PM</text>
        <line x1="85" y1="312" x2="295" y2="312" stroke="#E2E8F0" stroke-width="1" />
        <text x="95" y="316" font-family="Arial, sans-serif" font-weight="600" fill="#0F172A">Restorative Sleep Prep</text>
      </g>

      <!-- Bottom Verified Seal -->
      <g transform="translate(15 338)">
        <rect x="0" y="0" width="280" height="25" rx="6" fill="#F1F5F9" />
        <text x="140" y="16" font-family="Arial, sans-serif" font-size="9.5" font-weight="800" fill="#334155" text-anchor="middle" letter-spacing="1">
          ✓ 300 DPI VECTOR • STANDARD A4 &amp; UNIVERSAL
        </text>
      </g>

      <!-- Right Column: Habits, Metrics & Goal Accountability -->
      <g transform="translate(325 0)">
        <rect x="0" y="0" width="195" height="175" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
        <rect x="0" y="0" width="195" height="26" rx="10" fill="#D97706" />
        <text x="12" y="18" font-family="Arial, sans-serif" font-size="10.5" font-weight="800" fill="#FFFFFF">
          DAILY EXECUTIVE HABITS
        </text>
        <g font-family="Arial, sans-serif" font-size="10.5" font-weight="600" fill="#1E293B">
          <text x="14" y="50">☑ Hydration (3L Clean Water)</text>
          <text x="14" y="78">☑ 30-Min Cardio / Gym</text>
          <text x="14" y="106">☑ Screen-Free Evening Book</text>
          <text x="14" y="134">☑ Journal &amp; Gratitude Log</text>
          <text x="14" y="160">☑ Zero Distraction Work Block</text>
        </g>

        <!-- Financial & Productivity Metrics Card -->
        <g transform="translate(0 190)">
          <rect x="0" y="0" width="195" height="185" rx="10" fill="#0F172A" stroke="url(#goldFoil)" stroke-width="1.5" />
          <text x="12" y="24" font-family="Arial, sans-serif" font-size="10.5" font-weight="800" fill="url(#goldFoil)">
            ELITE DIGITAL VAULT
          </text>
          <text x="12" y="44" font-family="Arial, sans-serif" font-size="9" fill="#94A3B8">
            Access: 90 Days Unlocked
          </text>
          
          <rect x="12" y="58" width="170" height="35" rx="6" fill="#1E293B" />
          <text x="22" y="74" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#E2E8F0">Resolution Fidelity</text>
          <text x="22" y="87" font-family="'Courier New', monospace" font-size="10" font-weight="900" fill="#38BDF8">300 DPI VECTOR</text>

          <rect x="12" y="100" width="170" height="35" rx="6" fill="#1E293B" />
          <text x="22" y="116" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#E2E8F0">Formats Included</text>
          <text x="22" y="129" font-family="'Courier New', monospace" font-size="10" font-weight="900" fill="#FBBF24">PDF + EDITABLE DOC</text>

          <!-- Verified Badge -->
          <rect x="12" y="145" width="170" height="28" rx="8" fill="url(#goldFoil)" />
          <text x="97" y="163" font-family="Arial, sans-serif" font-size="10" font-weight="900" fill="#0F172A" text-anchor="middle" letter-spacing="1">
            ★ VERIFIED PREMIUM ★
          </text>
        </g>
      </g>
    </g>
  </g>

  <!-- LUXURY EMBOSSED GOLD BADGE (Top Right Floating) -->
  <g transform="translate(930 60)" filter="url(#luxuryShadow)">
    <circle cx="80" cy="80" r="75" fill="#0B132B" stroke="url(#goldFoil)" stroke-width="4" />
    <circle cx="80" cy="80" r="64" fill="none" stroke="url(#goldFoil)" stroke-width="1.5" stroke-dasharray="4,4" />
    <text x="80" y="55" font-family="Arial, sans-serif" font-size="10" font-weight="900" fill="url(#goldFoil)" text-anchor="middle" letter-spacing="2">
      OFFICIAL
    </text>
    <text x="80" y="78" font-family="Arial, sans-serif" font-size="20" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
      ELITE
    </text>
    <text x="80" y="98" font-family="Arial, sans-serif" font-size="11" font-weight="800" fill="url(#goldFoil)" text-anchor="middle" letter-spacing="2">
      PLANNER
    </text>
    <text x="80" y="118" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#94A3B8" text-anchor="middle">
      ★★★★★
    </text>
  </g>

  <!-- Luxury Gold Ballpoint Pen laying beside planner -->
  <g transform="rotate(25 360 620)" filter="url(#luxuryShadow)">
    <!-- Pen Barrel -->
    <rect x="330" y="320" width="22" height="420" rx="11" fill="url(#goldFoil)" stroke="#78350F" stroke-width="1" />
    <!-- Grip rings -->
    <line x1="330" y1="380" x2="352" y2="380" stroke="#78350F" stroke-width="2" />
    <line x1="330" y1="390" x2="352" y2="390" stroke="#78350F" stroke-width="2" />
    <line x1="330" y1="400" x2="352" y2="400" stroke="#78350F" stroke-width="2" />
    <!-- Clip -->
    <rect x="339" y="330" width="4" height="90" rx="2" fill="#FFFFFF" opacity="0.8" />
    <!-- Pen Tip -->
    <polygon points="330,735 352,735 341,765" fill="#1E293B" />
    <circle cx="341" cy="766" r="2.5" fill="#D97706" />
  </g>

  <!-- Banner Headline Overlay (Bottom Left Floating Badge) -->
  <g transform="translate(80 680)" filter="url(#luxuryShadow)">
    <rect x="0" y="0" width="380" height="135" rx="18" fill="#0B132B" stroke="url(#goldFoil)" stroke-width="2" />
    <text x="24" y="35" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="900" fill="url(#goldFoil)" letter-spacing="2">
      NEW PREMIUM COLLECTION
    </text>
    <text x="24" y="66" font-family="'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="900" fill="#FFFFFF">
      Elite Planners &amp; Guides
    </text>
    <text x="24" y="92" font-family="Arial, sans-serif" font-size="11.5" font-weight="500" fill="#94A3B8">
      Strategic Habit Trackers, Time-Blocking
    </text>
    <text x="24" y="110" font-family="Arial, sans-serif" font-size="11.5" font-weight="500" fill="#94A3B8">
      &amp; Executive Digital Productivity Guides
    </text>
  </g>
</svg>
